<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Irrigation System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #f1f6f3;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* LOGIN CARD */

        .login-container {

            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.10);

            border: 1px solid #e2e9e4;

            text-align: center;
        }


        /* LOGO */

        .logo {

            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            border-radius: 18px;

            background: #e4f3e8;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 36px;
        }


        /* TITLE */

        h1 {

            color: #183b29;

            font-size: 25px;

            margin-bottom: 8px;
        }


        .subtitle {

            color: #7a877f;

            font-size: 13px;

            margin-bottom: 32px;
        }


        /* FORM */

        .form-group {

            text-align: left;

            margin-bottom: 18px;
        }


        label {

            display: block;

            font-size: 12px;

            font-weight: bold;

            color: #435148;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #d9e2dc;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }


        input:focus {

            border-color: #2e7d32;

            box-shadow:
                0 0 0 3px rgba(46, 125, 50, 0.10);
        }


        /* PASSWORD */

        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-right: 70px;
        }


        .show-password {

            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            color: #2e7d32;

            font-size: 11px;

            font-weight: bold;

            cursor: pointer;
        }


        /* LOGIN BUTTON */

        .login-button {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background: #2e7d32;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .login-button:hover {

            background: #246728;

            transform: translateY(-1px);
        }


        .login-button:active {

            transform: translateY(0);
        }


        /* MESSAGE */

        #loginMessage {

            min-height: 18px;

            margin-top: 15px;

            font-size: 12px;

            font-weight: bold;
        }


        /* FOOTER */

        .login-footer {

            margin-top: 28px;

            padding-top: 18px;

            border-top: 1px solid #edf0ee;

            color: #9aa49e;

            font-size: 10px;
        }


        /* DEMO ACCOUNT */

        .demo-account {

            margin-top: 18px;

            padding: 10px;

            background: #f7f9f8;

            border-radius: 8px;

            color: #7b8780;

            font-size: 10px;

            line-height: 1.6;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            .login-container {

                width: calc(100% - 30px);

                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">
            🌱
        </div>


        <!-- TITLE -->

        <h1>
            Smart Irrigation
        </h1>


        <p class="subtitle">
            Real-Time Monitoring System
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Email
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your Email"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword">

                        Show

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
    type="button"
    class="login-button"
    id="continueButton">

    Continue

</button>


            <!-- MESSAGE -->

            <p id="loginMessage"></p>


        </form>


        <div class="login-footer">

            Smart Irrigation and Real-Time Monitoring System

        </div>


    </div>



    <!-- LOGIN JAVASCRIPT -->

    <script type="module">

import {
    auth
} from "./firebase-config.js";

import {
    signInWithEmailAndPassword,
    sendEmailVerification,
    signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import { claimSession } from "./session-limit.js";


// =====================================
// LOGIN ELEMENTS
// =====================================

const loginForm =
    document.getElementById("loginForm");

const continueButton =
    document.getElementById("continueButton");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginMessage =
    document.getElementById("loginMessage");

const showPassword =
    document.getElementById("showPassword");


// =====================================
// SHOW / HIDE PASSWORD
// =====================================

showPassword.addEventListener(
    "click",
    function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            showPassword.textContent = "Hide";

        } else {

            passwordInput.type = "password";

            showPassword.textContent = "Show";
        }

    }
);


// =====================================
// CONTINUE BUTTON
// =====================================

continueButton.addEventListener(
    "click",
    async function () {
                if (continueButton.dataset.ready === "login") {
            return;
        }

        const email =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            loginMessage.textContent =
                "Enter your email and password first.";

            loginMessage.style.color =
                "#c62828";

            return;
        }


        try {

            // Sign in to check the account

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            // =====================================
            // ALREADY VERIFIED
            // =====================================

            if (user.emailVerified) {

                loginMessage.textContent =
                    "Email already verified. You can now log in.";

                loginMessage.style.color =
                    "#2e7d32";

                continueButton.textContent =
                    "Login";

                continueButton.disabled =
                    false;

                continueButton.dataset.ready =
                    "login";

                return;
            }


            // =====================================
            // NOT VERIFIED
            // =====================================

            await sendEmailVerification(user);


            loginMessage.textContent =
                "Verification email sent. Check your inbox and click the verification link.";

            loginMessage.style.color =
                "#2e7d32";


            continueButton.textContent =
                "Waiting for Verification...";


            continueButton.disabled =
                true;


            // =====================================
            // CHECK FOR VERIFICATION
            // =====================================

            const verificationCheck =
                setInterval(
                    async function () {

                        try {

                            if (!auth.currentUser) {
                                return;
                            }


                            await auth.currentUser.reload();


                            if (
                                auth.currentUser.emailVerified
                            ) {

                                clearInterval(
                                    verificationCheck
                                );


                                loginMessage.textContent =
                                    "Email verified successfully. You can now log in.";

                                loginMessage.style.color =
                                    "#2e7d32";


                                continueButton.textContent =
                                    "Login";


                                continueButton.disabled =
                                    false;


                                continueButton.dataset.ready =
                                    "login";
                            }

                        } catch (error) {

                            console.error(
                                "Verification check error:",
                                error
                            );

                        }

                    },
                    2000
                );


        } catch (error) {

            console.error(
                "Authentication error:",
                error
            );


            loginMessage.textContent =
                "✕ Incorrect email or password.";

            loginMessage.style.color =
                "#c62828";


            passwordInput.value = "";

            passwordInput.focus();

        }

    }
);


// =====================================
// LOGIN FORM
// =====================================

continueButton.addEventListener(
    "click",
    async function () {

        if (
            continueButton.dataset.ready !== "login"
        ) {
            return;
        }


        const email =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            if (!auth.currentUser.emailVerified) {

                loginMessage.textContent =
                    "Please verify your email before logging in.";

                loginMessage.style.color =
                    "#c62828";

                return;
            }
                     // Check the 4-session limit
            const session = await claimSession();

            if (session.reason === "limit") {
                await signOut(auth);

                loginMessage.textContent =
                    "Maximum login limit reached (4 users). Log out on another device and try again.";

                loginMessage.style.color = "#c62828";
                return;
            }

            // If the check itself failed (network or quota), let the user in
            // instead of locking them out.

            // Save login status

            sessionStorage.setItem(
                "loggedIn",
                "true"
            );


            sessionStorage.setItem(
                "username",
                email
            );


            loginMessage.textContent =
                "✓ Login successful. Opening dashboard...";


            loginMessage.style.color =
                "#2e7d32";


            continueButton.disabled =
                true;


            continueButton.textContent =
                "Opening Dashboard...";


            setTimeout(
                function () {

                    window.location.href =
                        "dashboard.html";

                },
                500
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            loginMessage.textContent =
                "✕ Incorrect email or password.";

            loginMessage.style.color =
                "#c62828";


            passwordInput.value = "";

            passwordInput.focus();

        }

    }
);


    </script>


</body>

</html>
